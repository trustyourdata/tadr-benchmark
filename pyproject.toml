[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tadr-benchmark"
version = "0.1.0"
description = "Reproducible evaluation framework for task-aware dataset readiness"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.11,<3",
  "polars>=1.44.1,<2",
  "pyarrow>=25.0.1,<26",
  "psutil>=7,<8",
  "matplotlib>=3.10,<4",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
tadr-benchmark = "tadr_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
