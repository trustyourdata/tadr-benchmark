name: Public safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m tadr_benchmark.cli safety
